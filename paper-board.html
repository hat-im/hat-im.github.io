<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title></title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="shared/theme.css">
<link rel="stylesheet" href="paper-board/styles/paper-board.css">
</head>
<body>
  <div class="app" id="app">
    <div class="topbar">
      <div class="topbar-left">
        <h1 class="title" id="pageTitle"></h1>
        <p class="subtitle" id="pageSubtitle"></p>
      </div>
      <button class="pass-info-btn" id="threePassBtn" type="button">?</button>
      <button class="reset-btn" id="resetBtn" type="button"></button>
    </div>

    <div class="controls">
      <div class="search-progress-row">
        <div class="search-wrap">
          <svg class="search-icon" viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg">
            <circle cx="9" cy="9" r="6.5" stroke="currentColor" stroke-width="1.6"/>
            <line x1="13.5" y1="13.5" x2="18" y2="18" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
          </svg>
          <input type="text" class="search-input" id="searchInput" placeholder="">
        </div>

        <div class="progress-line">
          <button type="button" class="progress-toggle" id="progressToggle" aria-haspopup="true" aria-expanded="false">
            <span id="progressText"></span>
            <div class="popover" id="infoPopover">
              <div class="popover-title" id="popoverTitle"></div>
              <div class="popover-scroll" id="popoverBody"></div>
            </div>
          </button>
        </div>
      </div>

      <div class="chip-row" id="keywordChips"></div>
      <div class="chip-row" id="authorChips"></div>
      <div class="chip-row" id="venueChips"></div>
    </div>

    <div class="board-scroll" id="boardScroll">
      <div class="board" id="board">
        <div class="column" data-pass="unread">
          <div class="column-header">
            <span class="column-title" id="columnTitle-unread"></span><span class="column-count" id="count-unread">0</span>
            <select class="sort-select" id="sort-unread" data-pass="unread"></select>
          </div>
          <div class="column-drop" id="drop-unread" data-pass="unread"></div>
        </div>
        <div class="column" data-pass="pass-1">
          <div class="column-header">
            <span class="column-title" id="columnTitle-pass-1"></span><span class="column-count" id="count-pass-1">0</span>
            <select class="sort-select" id="sort-pass-1" data-pass="pass-1"></select>
          </div>
          <div class="column-drop" id="drop-pass-1" data-pass="pass-1"></div>
        </div>
        <div class="column" data-pass="pass-2">
          <div class="column-header">
            <span class="column-title" id="columnTitle-pass-2"></span><span class="column-count" id="count-pass-2">0</span>
            <select class="sort-select" id="sort-pass-2" data-pass="pass-2"></select>
          </div>
          <div class="column-drop" id="drop-pass-2" data-pass="pass-2"></div>
        </div>
        <div class="column" data-pass="pass-3">
          <div class="column-header">
            <span class="column-title" id="columnTitle-pass-3"></span><span class="column-count" id="count-pass-3">0</span>
            <select class="sort-select" id="sort-pass-3" data-pass="pass-3"></select>
          </div>
          <div class="column-drop" id="drop-pass-3" data-pass="pass-3"></div>
        </div>
      </div>
    </div>
  </div>

  <div class="modal-backdrop" id="modalBackdrop">
    <div class="modal">
      <p class="modal-title" id="modalTitle"></p>
      <p class="modal-body" id="modalBody"></p>
      <div class="modal-actions">
        <button class="modal-btn" id="modalCancel" type="button"></button>
        <button class="modal-btn confirm" id="modalConfirm" type="button"></button>
      </div>
    </div>
  </div>

  <div class="modal-backdrop" id="threePassBackdrop">
    <div class="modal three-pass-modal">
      <p class="modal-title" id="threePassTitle"></p>
      <p class="modal-body" id="threePassIntro"></p>
      <div id="threePassList"></div>
      <div class="modal-actions">
        <button class="modal-btn" id="threePassCloseBtn" type="button"></button>
      </div>
    </div>
  </div>

<script src="shared/scripts/dual-store.js"></script>
<script src="paper-board/scripts/app.js"></script>
</body>
</html>
