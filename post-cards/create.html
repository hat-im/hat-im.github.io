<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Make a postcard</title>
  <link rel="icon" type="image/svg+xml" href='data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><rect x="2" y="4" width="20" height="16" rx="2" fill="%23e6ecfb" stroke="%233a3a44" stroke-width="1.2"/><circle cx="17.5" cy="8.5" r="1.6" fill="%233a3a44"/><path d="M3 16l5-5 4 4 3-3 6 5" fill="none" stroke="%233a3a44" stroke-width="1.2"/></svg>'>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caveat&family=Courier+Prime:wght@400;700&family=Covered+By+Your+Grace&family=Homemade+Apple&family=Kalam:wght@400;700&family=Shadows+Into+Light&family=Special+Elite&display=swap">
  <link rel="stylesheet" href="/shared/gradient-shift.css">
  <link rel="stylesheet" href="/post-cards/styles/post-cards.css">
  <link rel="stylesheet" href="/post-cards/styles/create.css">
</head>
<body class="gradient-shift-bg">
  <div class="page create-page">
    <div class="toolbar">
      <a class="btn" href="/post-cards.html" id="backLink"></a>
    </div>

    <h1 id="pageHeading" class="create-heading"></h1>
    <p id="pageIntro" class="create-intro"></p>

    <div class="create-layout">
      <form class="create-form" id="createForm">
        <label class="field">
          <span class="field-label" id="mediaLabel"></span>
          <input type="file" id="mediaInput" accept="video/*,image/*">
          <span class="field-hint" id="mediaHint"></span>
        </label>

        <label class="field">
          <span class="field-label" id="subjectLabel"></span>
          <input type="text" id="subjectInput">
        </label>

        <label class="field">
          <span class="field-label" id="messageLabel"></span>
          <textarea id="messageInput" rows="5"></textarea>
        </label>

        <label class="field">
          <span class="field-label" id="fromLabel"></span>
          <input type="text" id="fromInput">
        </label>

        <label class="field">
          <span class="field-label" id="postscriptLabel"></span>
          <input type="text" id="postscriptInput">
        </label>

        <label class="field">
          <span class="field-label" id="toLabel"></span>
          <input type="text" id="toInput">
        </label>

        <label class="field">
          <span class="field-label" id="locationLabel"></span>
          <input type="text" id="locationInput">
        </label>

        <div class="field">
          <span class="field-label" id="colorLabel"></span>
          <div class="swatches" id="colorSwatches"></div>
        </div>

        <div class="form-actions">
          <button class="action-btn" type="button" id="shuffleBtn"></button>
          <button class="action-btn action-btn-primary" type="button" id="downloadGifBtn"></button>
        </div>
      </form>

      <div class="preview-panel">
        <div class="postcard-stage" id="postcardStage">
          <canvas id="postcardCanvas"></canvas>
        </div>
      </div>
    </div>
  </div>

  <script src="/post-cards/scripts/vendor/gif.js"></script>
  <script src="/post-cards/scripts/utils/hash-utils.js"></script>
  <script src="/post-cards/scripts/loaders/postcard-assets.js"></script>
  <script src="/post-cards/scripts/utils/postcard-render-utils.js"></script>
  <script src="/post-cards/scripts/render/postcard-config.js"></script>
  <script src="/post-cards/scripts/render/decorations/postcard-glyphs.js"></script>
  <script src="/post-cards/scripts/render/decorations/postcard-seals.js"></script>
  <script src="/post-cards/scripts/render/decorations/postcard-stickers.js"></script>
  <script src="/post-cards/scripts/render/layers/postcard-chrome.js"></script>
  <script src="/post-cards/scripts/render/layers/postcard-typography.js"></script>
  <script src="/post-cards/scripts/render/core/postcard-engine.js"></script>
  <script src="/post-cards/scripts/render/core/postcard-content.js"></script>
  <script src="/post-cards/scripts/render/core/postcard-draw.js"></script>
  <script src="/post-cards/scripts/pages/create-config.js"></script>
  <script src="/post-cards/scripts/pages/create.js"></script>
</body>
</html>
