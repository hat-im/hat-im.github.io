name: Update last-updated timestamp

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compute last commit timestamp
        id: date
        run: |
          TIMESTAMP=$(git log -1 --format=%cI -- . ':!shared/last-updated.json')
          echo "timestamp=$TIMESTAMP" >> "$GITHUB_OUTPUT"

      - name: Write shared/last-updated.json
        run: |
          printf '{"timestamp": "%s"}\n' "${{ steps.date.outputs.timestamp }}" > shared/last-updated.json

      - name: Commit if changed
        run: |
          if ! git diff --quiet -- shared/last-updated.json; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add shared/last-updated.json
            git commit -m "chore: update last-updated timestamp"
            git push
          fi
